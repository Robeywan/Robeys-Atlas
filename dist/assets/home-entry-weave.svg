<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160" role="img" aria-labelledby="title description">
  <title id="title">Warm interlacing ribbons</title>
  <desc id="description">Original contemporary interface decoration using warm brown and ochre interlacing geometric ribbons. Not a replica or attribution of a traditional Cherokee motif, and not cultural or historical evidence.</desc>
  <defs>
    <pattern id="weave" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#503a2d"/>
      <path d="M0 20h80M0 60h80" fill="none" stroke="#ad8046" stroke-width="18"/>
      <path d="M20 0v80M60 0v80" fill="none" stroke="#815e40" stroke-width="18"/>
      <path d="M0 20h40M40 60h40" fill="none" stroke="#ad8046" stroke-width="18"/>
      <path d="M0 12h40M40 52h40M12 40v40M52 0v40" fill="none" stroke="#d3ad6c" stroke-width="1.3" opacity=".65"/>
      <path d="M0 28h40M40 68h40M28 40v40M68 0v40" fill="none" stroke="#2e241d" stroke-width="1.5" opacity=".65"/>
      <path d="M0 17h40M40 57h40M17 40v40M57 0v40" fill="none" stroke="#d3ad6c" stroke-width=".7" opacity=".2"/>
    </pattern>
  </defs>
  <rect width="240" height="160" fill="url(#weave)"/>
</svg>
